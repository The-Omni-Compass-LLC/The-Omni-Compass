# The Prometheus Crane reads its history from (scripts/kind_addons_crane.sh; docs/CRANE_PREREGISTRATION.md), installed as
# Crane's own installation guide installs it (the prometheus-community chart, Crane's override values for its scrape and
# recording rules, the alert manager and the push gateway off, no persistent volume), with the chart's placement settings
# putting the server and kube-state-metrics on the control plane; the node exporter runs on every node, as shipped.
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
server:
  persistentVolume:
    enabled: false
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
kube-state-metrics:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}

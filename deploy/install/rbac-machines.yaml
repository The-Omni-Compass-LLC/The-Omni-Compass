# The cloud mode's grant (the Operator's Manual, section 14.3): the watch role of omni-compass.yaml plus two verbs. Park a
# machine (a PreferNoSchedule taint) and wake it (remove the taint, uncordon): patch nodes. Mark a parked machine's pods
# first to go (the pod-deletion-cost annotation): patch pods. Nothing else: no delete, no eviction, no autoscaler write,
# no pod resize, no cloud credential.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: omni-compass-machines}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: omni-compass-machines}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: omni-compass-machines}
subjects: [{kind: ServiceAccount, name: omni-compass, namespace: omni-compass}]

# FOSSA project configuration. Omni-Compass is proprietary (LicenseRef-OmniCompass-Evaluation-1.0).
version: 3
project:
  id: omni-compass
  name: Omni-Compass
  team: The Omni-Compass LLC
  url: https://github.com/The-Omni-Compass-LLC/The-Omni-Compass
paths:
  exclude:
    - ./out
    - ./release
# The license is custom (not in the SPDX list), so FOSSA is told what to look for: the SPDX tag every source file carries
# in its header, and the license's own title in LICENSE and LICENSES/.
customLicenseSearch:
  - matchCriteria: "LicenseRef-OmniCompass-Evaluation-1\\.0"
    name: "Omni-Compass Evaluation License 1.0 (proprietary; evaluation and simulation use only)"
  - matchCriteria: "Omni-Compass Evaluation License, version 1\\.0"
    name: "Omni-Compass Evaluation License 1.0 (proprietary; evaluation and simulation use only)"

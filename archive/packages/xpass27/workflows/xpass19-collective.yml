name: XPASS19 collective qualification
on:
  workflow_dispatch:
    inputs:
      populations:
        description: "Comma-separated total trajectory populations"
        required: true
        default: "640,6400,64000,640000,1000000"
      steps:
        description: "Collective macro steps"
        required: true
        default: "24"
jobs:
  collective:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt pytest
      - name: Tests and collective ladder
        env:
          OMNI_SCALE_LADDER: ${{ inputs.populations }}
          OMNI_SCALE_STEPS: ${{ inputs.steps }}
        run: ./RUN_XPASS19_GITHUB.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xpass19-collective-receipts
          path: results/xpass19_scale_ladder/

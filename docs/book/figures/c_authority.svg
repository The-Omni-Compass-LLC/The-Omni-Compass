   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="134.28" y="18.323438" transform="rotate(-0 134.28 18.323438)">the body calm (the engine: push ≤ release)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="134.28" y="49.435313" transform="rotate(-0 134.28 49.435313)">the line clean for the last 3 decisions</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="134.28" y="78.803437" transform="rotate(-0 134.28 78.803437)">nothing pending: no pod waiting, not scaling up</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="134.28" y="109.043438" transform="rotate(-0 134.28 109.043438)">every sense live (none blind or stale)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="134.28" y="139.283437" transform="rotate(-0 134.28 139.283437)">the last command landed (proprioception 0)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="134.28" y="169.523438" transform="rotate(-0 134.28 169.523438)">the remaining muscles stay inside the band</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="134.28" y="199.763438" transform="rotate(-0 134.28 199.763438)">the verdict allows the step</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="308.88" y="109.840781" transform="rotate(-0 308.88 109.840781)">AND</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(370.413281 96.335859)">GIVE BACK: one</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(365.730469 104.956172)">unit a decision, or</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(366.728203 114.415312)">the calm share of</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(380.915859 122.543437)">the surplus</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(24.837891 243.503437)">the service past the wall, a sense blind, or a pod</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(117.869062 252.503437)">waiting</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="134.28" y="278.243437" transform="rotate(-0 134.28 278.243437)">NOT a security hold (the hold flag, the forbidden key)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a1a1a" x="308.88" y="263.920781" transform="rotate(-0 308.88 263.920781)">AND</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(374.895 249.897656)">ADD: at once,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(363.950859 258.965859)">never held back (a</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(369.77625 267.623437)">parked machine</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(366.678281 276.965859)">woken within 5 s)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(8.28 316.223437)">Asymmetric on purpose: adding is cheap to undo and expensive to delay; taking back is</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(8.28 325.223437)">cheap to delay and expensive to get wrong. Every held decision writes the first reason that</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(8.28 335.095312)">failed.</text>
   </g>

   <g id="text_1">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(46.675547 28.655859)">REFERENCE r</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(15.651562 36.863438)">median cost per request at</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(14.112422 45.863438)">the deepest allowed step, n</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(65.752734 55.655859)">≥ 30</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(219.097266 33.160781)">TRIAL t</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(175.323516 41.363438)">median cost one step past</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(175.439531 50.776172)">it, n ≥ 30, the same traffic</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(352.544766 32.705859)">t ≤ r·(1 + a) and</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(341.860781 41.705859)">t ≤ c[native]·(1 + a)?</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(370.471641 51.155859)">a = 0.02</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(19.667812 154.763438)">YES: step allowed. The deepest allowed</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(23.864766 163.763438)">step moves one deeper; the next trial</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(85.260937 172.763438)">may begin</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(245.199375 154.763438)">NO: step refused, the muscle is slower there.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(264.194297 163.763438)">The knob stays; not tried again for R</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #1a1a1a" transform="translate(262.977891 173.105859)">decisions (GPU 900, Kubernetes 120)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2e6b3a" x="118.08" y="100.764141" transform="rotate(-0 118.08 100.764141)">yes</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8a1f1f" x="355.68" y="101.636016" transform="rotate(-0 355.68 101.636016)">no</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(8.28 207.863438)">The verdict stands over every slow knob (the machines, the clock ceiling, a cache's notch): a</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(8.28 216.863438)">step that costs the muscle's own work more than the allowance is refused, and steps cannot</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(8.28 225.863438)">add up beyond it. A trial runs to its full measurement and is never ended by the calm it</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(8.28 234.836016)">causes.</text>
   </g>
  </g>

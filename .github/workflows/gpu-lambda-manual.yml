# Manual GPU benchmark: runs ONLY on a self-hosted runner explicitly labeled omni-gpu.
# No secrets are echoed; this workflow does not provision or SSH into Lambda instances.
name: gpu-lambda-manual
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'smoke or confirm; confirm requires approved envelope and frozen clean code'
        required: true
        type: choice
        options: [smoke, confirm]
        default: smoke
      gpu:
        description: 'GPU device index'
        required: true
        default: '0'
      duration:
        description: 'Seconds per arm (smoke)'
        required: true
        default: '300'
permissions:
  contents: read
jobs:
  paired-gpu:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 300
    concurrency:
      group: omni-gpu-physical
      cancel-in-progress: false
    env:
      GPU: ${{ inputs.gpu }}
      PHASE: ${{ inputs.phase }}
      REPS: '1'
      REPS_CONFIRM: '10'
      OMNI_ENGINE: compass
      OMNI_DIAL: max
      STOP_AFTER_SMOKE: "1"
      SMOKE_REPS: "1"
      SMOKE_DURATION: "180"
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify GPU and approved envelope
        shell: bash
        run: |
          set -euo pipefail
          command -v nvidia-smi
          nvidia-smi --query-gpu=index,name,driver_version,power.limit --format=csv
          python3 -c 'import torch; assert torch.cuda.is_available()'
          test "$PHASE" != confirm || test -z "$(git status --porcelain)"
      - name: Run existing rented-GPU harness on physical GPU
        shell: bash
        run: |
          set -euo pipefail
          # Runner operator must configure passwordless narrowly scoped sudo for this script.
          sudo --preserve-env=GPU,OMNI_ENGINE,OMNI_DIAL,STOP_AFTER_SMOKE,SKIP_CONFIRM,SKIP_DECODE,SKIP_CAP,SKIP_DRILL,SKIP_HIL,SKIP_LLM,SMOKE_REPS,SMOKE_DURATION \
            bash scripts/gpu_rented_run.sh
      - name: Archive measurements, including failed-run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gpu-physical-receipts-${{ github.run_id }}
          path: results/gpu/
          if-no-files-found: warn
          retention-days: 30
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

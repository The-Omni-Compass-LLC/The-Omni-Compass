name: six-kube
# The six organisms with the real Kubernetes cluster inside (tools/run_kil.py): the four realms, the whole tower and the
# four stacked, each native against native with Omni-Compass on top (compass law), paired on one
# runner per repetition, each arm on a fresh six-worker kind cluster (scripts/kind_paired.sh). Six organisms times two
# arms: twelve columns, one report (tools/six_kube_report.py -> SIX_KUBE.md).
on:
  workflow_dispatch:
    inputs:
      reps: {description: "Paired repetitions per organism at each size, in the order of sizes", default: "5,5,3"}
      sizes: {description: "Copies of each organism on one clock, the real cluster inside (1, 10, 100, 1000)", default: "10,100,1000"}
      durations_s: {description: "Measured seconds per arm at each size (240 organism steps; a bigger organism needs a longer step)", default: "960,1440,2880"}
      arms: {description: "Arms, in rotation order", default: "native compass"}
      load_max: {description: "Load-generator replicas at each organism's peak demand", default: "6"}
      loadgen: {description: "closed (waits for answers) or open (fixed rate, equal work)", default: "open"}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: {cells: "${{ steps.r.outputs.cells }}"}
    steps:
      - id: r
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          sizes = [int(x) for x in "${{ github.event.inputs.sizes || '10,100,1000' }}".split(",")]
          reps = [int(x) for x in "${{ github.event.inputs.reps || '5,5,3' }}".split(",")]
          durs = [int(x) for x in "${{ github.event.inputs.durations_s || '960,1440,2880' }}".split(",")]
          orgs = ["compute_ai_cloud", "physics_robotics_autonomous", "energy_facility_industrial", "distribution_specialized",
                  "tower", "stack"]
          cells = [{"organism": o, "size": sz, "rep": r, "duration": durs[min(i, len(durs) - 1)]}
                   for i, sz in enumerate(sizes) for o in orgs for r in range(1, reps[min(i, len(reps) - 1)] + 1)]
          print("cells=" + json.dumps(cells))
          PY
  run:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 16   # 20 runners on this plan: 4 stay free for Azure and the big organisms (one job each)
      matrix:
        cell: "${{ fromJSON(needs.plan.outputs.cells) }}"
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: helm/kind-action@v1
        with: {install_only: true}
      - run: bash scripts/kind_paired.sh
        env:
          REP: ${{ matrix.cell.rep }}
          ARMS: ${{ github.event.inputs.arms || 'native compass' }}
          DURATION: ${{ matrix.cell.duration }}
          ORGANISM: ${{ matrix.cell.organism }}
          ORGANISM_SCALE: ${{ matrix.cell.size }}
          LOAD_MAX: ${{ github.event.inputs.load_max || '6' }}
          LOADGEN: ${{ github.event.inputs.loadgen || 'open' }}
          CLOSURE: tuning/GLOBAL_LEAGUE_PREREGISTRATION.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "six-${{ matrix.cell.organism }}-x${{ matrix.cell.size }}-${{ matrix.cell.rep }}", path: "bench-*-${{ matrix.cell.rep }}"}
  report:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: {pattern: "six-*", path: six}
      - run: python tools/six_kube_report.py six
      - run: cat six/SIX_KUBE.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: six-kube, path: "six/SIX_KUBE.*"}

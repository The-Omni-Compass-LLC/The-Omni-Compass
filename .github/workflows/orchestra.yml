name: orchestra
# The orchestra, the eighth organism (the founder's word of 19 October, night), on GitHub's own machine: every catalog
# muscle that stands for a knob of the governors and orchestrators he named, each governor's muscles as a body of its own
# and all of them together, native against Omni-Compass on top at the max, under the three organism loads, on the realms'
# preregistered seeds 3000-3009 (tools/run_orchestra.py). Evidence class S (modelled). The run is deterministic: every
# reading must match the table committed in results/orchestra/ and every number lie within 1e-3 or 0.5% of it, so its
# three runs (A, B and C) show the same table reproduced on three machines. Started by hand (Actions -> orchestra).
run-name: "orchestra: ${{ inputs.label }}"
on:
  workflow_dispatch:
    inputs:
      label: {description: "The run's letter in its three-run set (A, B or C)", default: "A"}
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
# the token reads the code and nothing else: this workflow pushes nothing, starts nothing and reads no other run
# (docs/THREAT_MODEL.md, T9)
permissions:
  contents: read
jobs:
  orchestra:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Engine and source receipt
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/omni_version.py | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: The orchestra, native and with Omni-Compass on top (seeds 3000-3009, own load, the climb, the line)
        run: python3 tools/run_orchestra.py --out orchestra-out
      - name: The same table as the one committed
        run: |
          set -o pipefail
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          a = json.load(open("orchestra-out/ORCHESTRA.json")); b = json.load(open("results/orchestra/ORCHESTRA.json"))
          if a["run"]["bodies"] != b["run"]["bodies"] or a["run"]["engine_digest"] != b["run"]["engine_digest"]:
              print("::notice::the committed table is from another engine or another mapping: nothing to compare")
              sys.exit(1)
          bad = []
          for load, bodies in b["bodies"].items():
              for body, o in bodies.items():
                  m = a["bodies"][load][body]
                  if m["label"] != o["label"]:
                      bad.append((load, body, "reading", m["label"], o["label"]))
                  for k, v in o["summary"].items():
                      for x, y in zip(m["summary"][k], v):
                          if abs(x - y) > max(1e-3, 0.005 * abs(y)):
                              bad.append((load, body, k, x, y))
          print(f"committed orchestra reproduced: {sum(len(v) for v in b['bodies'].values())} bodies and loads, {len(bad)} differences")
          for d in bad[:40]:
              print("  differs:", d)
          sys.exit(1 if bad else 0)
          PY
      - name: Results summary
        if: always()
        run: sed -n '/## The organism/,/## The climb/p' orchestra-out/ORCHESTRA.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: orchestra-results, path: orchestra-out}
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - name: Legal files beside the files this run hands out
        if: always()
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: _legal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Legal notice handed out with this run's files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legal-notice
          overwrite: true
          path: |
            _legal/README.md
            _legal/LICENSE
            _legal/NOTICE
            _legal/DISCLOSURES.md
            _legal/PATENTS.md
            _legal/TRADEMARKS.md

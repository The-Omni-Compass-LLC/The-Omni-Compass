name: archive-run
# Copies the raw files of finished live runs (every artifact: capture CSV, response-time CSV, audit log, controller
# log, SHA-256 manifest per repetition, and the aggregate) into the repository under results/live/raw/run-<id>/, so
# they live with the code and survive the artifact retention window. The run ids are read from
# .github/archive_request.txt (one per line); pushing a change to that file starts this workflow.
on:
  push:
    paths: [".github/archive_request.txt"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      # the archive is tens of gigabytes: the checkout leaves the archived runs out, and a run counts as archived when the
      # repository holds its folder (git's index, not the disk)
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - name: Copy every listed run's files
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # one run id per line (or separated by spaces); a run already archived is left as it is
          for run in $(cat .github/archive_request.txt); do
            d="results/live/raw/run-$run"
            git cat-file -e "HEAD:$d" 2>/dev/null && { echo "::notice::run $run is already archived"; continue; }
            # only a finished run is copied: a run still going would leave a part of its files here, and the part would
            # then be taken for the whole (the directory is never touched again once it exists)
            state=$(gh run view "$run" -R "${{ github.repository }}" --json status,conclusion -q '.status + " " + .conclusion')
            case "$state" in completed*) ;; *) echo "::warning::run $run is not finished ($state): left for a later pass"; continue;; esac
            gh run download "$run" -R "${{ github.repository }}" -D "$d" || { echo "::warning::run $run: no files to copy"; continue; }
            # GitHub refuses a file over 100 MB: a raw file over 50 MB (the 1,000-copy organism records) is stored
            # gzipped (-n: the same bytes every time). Its repetition's SHA256SUMS.txt still holds the original's hash;
            # check it with: gunzip -c FILE.gz | sha256sum
            find "$d" -type f -size +50M -exec gzip -n -9 {} \;
            ( cd "$d" && find . -type f ! -name SHA256SUMS_ALL.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS_ALL.txt )
            git add --sparse "$d"
            git commit -q -m "Raw files of live run $run archived with the code"
            echo "::notice::run $run archived: $(find "$d" -type f | wc -l) files"
          done
          # the branch may have moved while the files were copied (another push landed): rebase and push again, up to six times
          for attempt in 1 2 3 4 5 6; do
            git pull -q --rebase && git push && exit 0
            echo "::warning::push attempt $attempt failed (the branch moved); trying again"; sleep 15
          done
          echo "::error::the archived files could not be pushed after six attempts"; exit 1
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

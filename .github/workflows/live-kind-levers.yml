# Live proof of the added levers (rightsize, coldstart, batch pace, containment, cooling connector) on kind.
# Runs on demand (Actions tab -> live-kind-levers -> Run workflow) or on a pushed commit whose message contains [levers].
name: live-kind-levers
on:
  workflow_dispatch:
  push:
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. All patents, copyrights and trademarks filed in the USA. Everything in this repository is subject to change at any time; www.omni-compass.com is the authority of record. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`.'
jobs:
  levers:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[levers]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: helm/kind-action@v1
        with: {cluster_name: omni-levers, config: deploy/kind/cluster-full.yaml}
      - run: bash scripts/kind_levers.sh
        env: {OUT_DIR: levers_out}
      - name: Results summary
        if: always()
        run: |
          { echo "## Omni-Compass live levers"; echo '```'; cat levers_out/levers.txt 2>/dev/null || echo "(missing)"; echo '```'
            echo '```'; cat levers_out/rbac_levers.txt 2>/dev/null; echo '```'
            echo '```'; tail -n 60 levers_out/controller.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: live-levers, path: levers_out}
      - name: Legal files beside the files this run hands out
        if: always()
        uses: actions/checkout@v4
        with:
          path: _legal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Legal notice handed out with this run's files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legal-notice
          overwrite: true
          path: |
            _legal/README.md
            _legal/LICENSE
            _legal/NOTICE
            _legal/DISCLOSURES.md
            _legal/PATENTS.md
            _legal/TRADEMARKS.md
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

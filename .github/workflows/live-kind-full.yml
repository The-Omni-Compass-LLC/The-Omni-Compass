name: live-kind-full
# Full-engine live pilot: multi-node kind cluster, Omni-Compass driving the HPA target and the node pool
# (cordon/drain/uncordon) with live power sensing, then the reset. Started by hand
# (Actions tab -> live-kind-full -> Run workflow) or by a pushed commit whose message contains [full].
on:
  workflow_dispatch:
    inputs:
      phase_s:
        description: "Seconds per phase (baseline, then full engine)"
        default: "600"
  push:
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. All patents, copyrights and trademarks filed in the USA. Everything in this repository is subject to change at any time; www.omni-compass.com is the authority of record. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`.'
jobs:
  kind-full:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[full]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: helm/kind-action@v1
        with: {cluster_name: omni-full, config: deploy/kind/cluster-full.yaml}
      - run: bash scripts/kind_full.sh
        env:
          OUT_DIR: kind_full_out
          PHASE_S: ${{ github.event.inputs.phase_s || '600' }}
      - name: Results summary
        if: always()
        run: |
          {
            echo "## Omni-Compass full-engine live pilot"
            for f in observe_writes.txt kill_switch.txt muscles.txt score.txt; do
              echo "### $f"; echo '```'; cat "kind_full_out/$f" 2>/dev/null || echo "(missing)"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: kind-full-results, path: kind_full_out}
      - name: Legal files beside the files this run hands out
        if: always()
        uses: actions/checkout@v4
        with:
          path: _legal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Legal notice handed out with this run's files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legal-notice
          overwrite: true
          path: |
            _legal/README.md
            _legal/LICENSE
            _legal/NOTICE
            _legal/DISCLOSURES.md
            _legal/PATENTS.md
            _legal/TRADEMARKS.md
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

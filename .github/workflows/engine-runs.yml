name: engine-runs
# The founder's order of 21 October: the live engine and the Python run the same runs, and every set the jump generator runs on
# GitHub is linked to the live engine. A dispatch runs another set (500 by default) from a new base seed (this run's own number,
# unless one is given): tools/engine_runs.py writes every receipt and one SHA-256 digest; the live engine page's own code (its
# ported engine and its loop, run in node) computes the same set and must give the same receipts and the same digest on every
# run; the record is committed to results/engine_runs/ with this run's id, address and commit, and the page shows the newest
# record with the GitHub run that made it (docs/engine/build_live_engine.py). Nothing is billed: GitHub's own machine.
on:
  workflow_dispatch:
    inputs:
      runs: {description: "Runs from the jump generator", default: "500"}
      base: {description: "The jump generator's base seed (empty: this run's own number, so every dispatch is another set)", default: ""}
permissions:
  contents: write
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and Simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
jobs:
  runs:
    concurrency: {group: engine-runs, cancel-in-progress: false}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4: the code, not the archive of raw runs
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - name: The Python's runs from the jump generator
        run: |
          set -euo pipefail
          base="${{ github.event.inputs.base }}"; [ -n "$base" ] || base=$(( GITHUB_RUN_ID % 4294967296 ))
          echo "BASE=$base" >> "$GITHUB_ENV"
          python3 tools/omni_version.py | head -1 | tee -a "$GITHUB_STEP_SUMMARY"
          python3 tools/engine_runs.py --runs "${{ github.event.inputs.runs || '500' }}" --base "$base" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The live engine's own code runs the same set, every run of it
        run: |
          set -euo pipefail
          python3 tools/engine_runs.py --verify docs/engine/OMNI_COMPASS_LIVE_ENGINE.html --all --runs "${{ github.event.inputs.runs || '500' }}" --base "$BASE" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The record committed, with this run's link
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/legal.py --check > legal.txt || { tail -20 legal.txt; echo "::error::a page lacks the legal notice"; exit 1; }
          git add results/engine_runs/
          git commit -q -m "The Python's runs from the jump generator: base $BASE, checked in the live engine's own code (engine-runs run $GITHUB_RUN_ID)"
          for attempt in 1 2 3 4 5 6; do
            git pull -q --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "::warning::push attempt $attempt failed (the branch moved); trying again"; sleep 15
          done
          echo "::error::the record could not be pushed after six attempts"; exit 1
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

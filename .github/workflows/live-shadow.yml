# The shadow-pilot kit (scripts/pilot_shadow.sh) run end to end on kind with the demo workload and load: read-only
# identity proven, closure-law recommendations logged, zero writes asserted, SHADOW_REPORT.md produced.
# Started by hand or by a pushed commit whose message contains [shadow].
name: live-shadow
on:
  workflow_dispatch:
  push:
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. All patents, copyrights and trademarks filed in the USA. Everything in this repository is subject to change at any time; www.omni-compass.com is the authority of record. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`.'
jobs:
  shadow:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[shadow]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - uses: helm/kind-action@v1
        with: {cluster_name: omni-shadow, config: deploy/kind/cluster-full.yaml}
      - run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml
          kubectl -n kube-system patch deployment metrics-server --type=json -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl -n kube-system rollout status deployment/metrics-server --timeout=300s
          kubectl apply -f deploy/kind/demo.yaml -f deploy/kind/loadgen.yaml
          kubectl rollout status deployment/php-apache --timeout=300s
          for i in $(seq 1 30); do kubectl top nodes >/dev/null 2>&1 && break; sleep 10; done
      - run: bash scripts/pilot_shadow.sh
        env: {DURATION: "600", OUT_DIR: shadow_out}
      - if: always()
        run: |
          { cat shadow_out/SHADOW_REPORT.md; cat shadow_out/rbac_shadow.txt; tail -n 30 shadow_out/controller.log; } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: live-shadow, path: shadow_out}
      - name: Legal files beside the files this run hands out
        if: always()
        uses: actions/checkout@v4
        with:
          path: _legal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Legal notice handed out with this run's files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legal-notice
          overwrite: true
          path: |
            _legal/README.md
            _legal/LICENSE
            _legal/NOTICE
            _legal/DISCLOSURES.md
            _legal/PATENTS.md
            _legal/TRADEMARKS.md
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

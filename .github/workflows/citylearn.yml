name: citylearn
# Omni-Compass on top of CityLearn's own controller (docs/CITYLEARN_PREREGISTRATION.md): an independent simulator of
# real buildings, their solar panels and batteries, scored by CityLearn itself. One job per district, native and
# native + Omni-Compass; one report (results/citylearn/CITYLEARN.md).
on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "CityLearn districts, comma separated; 'untouched' runs every district CityLearn ships except the tuning district and round 1's"
        default: "untouched"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: {sets: "${{ steps.r.outputs.sets }}"}
    steps:
      - id: r
        run: |
          if [ "${{ github.event.inputs.datasets }}" = untouched ]; then
            GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 https://github.com/intelligent-environments-lab/citylearn /tmp/cl
            seen="citylearn_challenge_2022_phase_1 citylearn_challenge_2022_phase_2 citylearn_challenge_2022_phase_3 citylearn_challenge_2022_phase_all citylearn_challenge_2021 citylearn_challenge_2020_climate_zone_1 citylearn_challenge_2020_climate_zone_2 citylearn_challenge_2020_climate_zone_3 citylearn_challenge_2020_climate_zone_4 citylearn_challenge_2023_phase_1"
            sets=$(for d in /tmp/cl/data/datasets/*/; do n=$(basename "$d"); [ -f "$d/schema.json" ] && ! echo " $seen " | grep -q " $n " && echo "$n"; done | python3 -c "import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))")
          else
            sets=$(python3 -c "import json; print(json.dumps('${{ github.event.inputs.datasets }}'.split(',')))")
          fi
          echo "sets=$sets" | tee -a "$GITHUB_OUTPUT"
  run:
    needs: plan
    strategy:
      fail-fast: false
      matrix: {dataset: "${{ fromJSON(needs.plan.outputs.sets) }}"}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q citylearn
      - run: GIT_LFS_SKIP_SMUDGE=1 git clone -q --depth 1 https://github.com/intelligent-environments-lab/citylearn /tmp/cl
      - run: python tools/run_citylearn.py --datasets "${{ matrix.dataset }}" --data-dir /tmp/cl/data/datasets --out out
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "citylearn-${{ matrix.dataset }}", path: out}
  report:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/download-artifact@v4
        with: {pattern: "citylearn-*", path: all, merge-multiple: true}
      - run: python tools/run_citylearn.py --report-only all --out all
      - run: cat all/CITYLEARN.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: citylearn-report, path: "all/CITYLEARN.md"}

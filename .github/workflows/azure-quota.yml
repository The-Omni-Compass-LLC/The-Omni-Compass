name: azure-quota
# Asks Azure to raise the subscription's compute core allowance in one region (the Microsoft.Quota API, free of charge;
# Azure grants or refuses, usually within minutes to a day). The allowance, not the credits, sets how big an AKS fleet
# the metered runs can rent: 2 vCPUs a worker, one machine for the system pool. Prints the allowance before and after
# and the request's state. Nothing is rented. Uses the AZURE_CREDENTIALS secret; if the service principal may not file
# quota requests, the job says so and the owner files the same request in the portal (Quotas > Compute > the region).
on:
  workflow_dispatch:
    inputs:
      location: {description: "Azure region", default: "eastus"}
      cores: {description: "Total regional vCPUs to ask for", default: "200"}
      family: {description: "The machine family to raise with it (the AKS workers' size family)", default: "standardDSv4Family"}
jobs:
  quota:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: azure/login@v2
        with: {creds: "${{ secrets.AZURE_CREDENTIALS }}"}
      - name: Ask for the allowance
        run: |
          LOC="${{ github.event.inputs.location || 'eastus' }}"; CORES="${{ github.event.inputs.cores || '200' }}"
          FAM="${{ github.event.inputs.family || 'standardDSv4Family' }}"
          SUB=$(az account show --query id -o tsv)
          echo "before:"; az vm list-usage -l "$LOC" -o tsv --query "[?name.value=='cores' || name.value=='$FAM'].[name.localizedValue, currentValue, limit]"
          az extension add -n quota -y >/dev/null 2>&1 || true
          SCOPE="/subscriptions/$SUB/providers/Microsoft.Compute/locations/$LOC"
          ok=1
          for res in cores "$FAM"; do
            if az quota update --resource-name "$res" --scope "$SCOPE" --limit-object value="$CORES" --resource-type dedicated -o json > "q-$res.json" 2> "q-$res.err"; then
              echo "::notice::$res in $LOC: asked for $CORES; state $(python3 -c "import json;d=json.load(open('q-$res.json'));print(d.get('properties',{}).get('provisioningState') or d.get('provisioningState') or d)")"
            else
              ok=0; echo "::warning::$res in $LOC: the request was not accepted: $(tr '\n' ' ' < q-$res.err | cut -c1-500)"
            fi
          done
          echo "after:"; az vm list-usage -l "$LOC" -o tsv --query "[?name.value=='cores' || name.value=='$FAM'].[name.localizedValue, currentValue, limit]"
          [ "$ok" = 1 ] || echo "::error::Azure did not accept the automated request; file it in the portal: Subscriptions > this subscription > Usage + quotas > Compute > $LOC > Total Regional vCPUs and $FAM > Request increase > $CORES"

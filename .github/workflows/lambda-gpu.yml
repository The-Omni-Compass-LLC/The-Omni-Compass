name: lambda-gpu
# The GPU benchmark on a rented Lambda Cloud machine, one button (Actions -> lambda-gpu -> Run workflow): the 8-GPU result
# (scripts/gpu_8card.sh) or the one-card test (scripts/gpu_rented_run.sh), at the exact commit the button is pressed on.
# It shows the price first and rents nothing on a dry run (the default). Otherwise it rents one machine, ships the
# committed tree to it, starts the run, watches it from GitHub, brings every result file back as this run's artifact,
# and always gives the machine back: when the run prints its last line, or at the hour budget plus one hour whatever
# happens, or at the very end of this workflow if anything before failed. Needs three repository secrets:
# LAMBDA_API_KEY, LAMBDA_SSH_PRIVATE_KEY and LAMBDA_SSH_KEY_NAME (docs/omni_v5/BENCHMARKS_V5.md, click by click).
# Missing secrets are reported and nothing is rented. Nothing here publishes a result: the founder hears what it says first.
on:
  workflow_dispatch:
    inputs:
      test: {description: "8card (the 8-GPU result) or 1card (the one-card test)", default: "8card"}
      mode: {description: "pooled, fast or full (8card: about 10, 3.5 or 18 hours; 1card: fast about 7, full about 30)", default: "pooled"}
      instance_type: {description: "Lambda machine type (empty: gpu_8x_a100_80gb_sxm4 for 8card, gpu_1x_a10 for 1card)", default: ""}
      region: {description: "Lambda region (empty: the first with a machine free)", default: ""}
      max_cost: {description: "Ceiling in US dollars for the hour budget plus one hour; above it nothing is rented", default: "400"}
      dry_run: {description: "Show the price and the plan, rent nothing (yes/no)", default: "yes"}
permissions:
  contents: read
concurrency: {group: lambda-gpu, cancel-in-progress: false}
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
  LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      launched: ${{ steps.go.outputs.launched }}
      id: ${{ steps.go.outputs.id }}
      ip: ${{ steps.go.outputs.ip }}
      deadline: ${{ steps.go.outputs.deadline }}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Rent, ship, start (or show the price on a dry run)
        id: go
        env:
          HAVE: ${{ secrets.LAMBDA_API_KEY != '' && secrets.LAMBDA_SSH_PRIVATE_KEY != '' && secrets.LAMBDA_SSH_KEY_NAME != '' }}
          SSH_PRIVATE: ${{ secrets.LAMBDA_SSH_PRIVATE_KEY }}
          KEY_NAME: ${{ secrets.LAMBDA_SSH_KEY_NAME }}
          TEST: ${{ github.event.inputs.test }}
          MODE: ${{ github.event.inputs.mode }}
          TYPE_IN: ${{ github.event.inputs.instance_type }}
          REGION: ${{ github.event.inputs.region }}
          MAX_COST: ${{ github.event.inputs.max_cost }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "launched=false" >> "$GITHUB_OUTPUT"
          case "$TEST:$MODE" in
            8card:pooled) SCRIPT=scripts/gpu_8card.sh; ENVS="POOLED=1"; BUDGET=10.5;;
            8card:fast)   SCRIPT=scripts/gpu_8card.sh; ENVS="FAST=1";   BUDGET=4;;
            8card:full)   SCRIPT=scripts/gpu_8card.sh; ENVS="";         BUDGET=26;;
            1card:fast)   SCRIPT=scripts/gpu_rented_run.sh; ENVS="SKIP_DECODE=1 SKIP_CAP=1 SKIP_HIL=1 SKIP_LLM=1"; BUDGET=8;;
            1card:full)   SCRIPT=scripts/gpu_rented_run.sh; ENVS="";    BUDGET=32;;
            *) echo "unknown test/mode $TEST/$MODE" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1;;
          esac
          TYPE="${TYPE_IN:-$([ "$TEST" = 8card ] && echo gpu_8x_a100_80gb_sxm4 || echo gpu_1x_a10)}"
          HOURS=$(python3 -c "print(float('$BUDGET') + 1)")
          { echo "## The GPU benchmark on Lambda: $TEST, $MODE, commit \`${GITHUB_SHA::12}\`"; echo
            echo "Script \`$SCRIPT\` ${ENVS:+with \`$ENVS\`}; hour budget $BUDGET, given back at $HOURS hours at the latest."; echo; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAVE" != true ]; then
            echo "Secrets missing (LAMBDA_API_KEY, LAMBDA_SSH_PRIVATE_KEY, LAMBDA_SSH_KEY_NAME): nothing rented." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e; python3 scripts/lambda_gpu.py plan --type "$TYPE" --hours "$HOURS" --max-cost "$MAX_COST" | tee plan.txt; rc=${PIPESTATUS[0]}; set -e
          { echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          [ "$rc" = 0 ] || { echo "Nothing rented." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          if [ "$DRY" = yes ]; then echo "Dry run: nothing rented." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          NAME="omni-$TEST-$(date +%s)-${BUDGET%.*}"
          ID=$(python3 scripts/lambda_gpu.py launch --type "$TYPE" --name "$NAME" --ssh-key-name "$KEY_NAME" ${REGION:+--region "$REGION"})
          echo "id=$ID" >> "$GITHUB_OUTPUT"; echo "launched=true" >> "$GITHUB_OUTPUT"
          DEADLINE=$(python3 -c "import time; print(int(time.time() + $HOURS * 3600))")
          echo "deadline=$DEADLINE" >> "$GITHUB_OUTPUT"
          echo "Rented machine \`$ID\` ($NAME); given back by $(date -u -d @"$DEADLINE" '+%Y-%m-%d %H:%M') UTC at the latest." >> "$GITHUB_STEP_SUMMARY"
          IP=$(python3 scripts/lambda_gpu.py wait "$ID" --timeout 1800)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          install -m 600 /dev/null key; printf '%s\n' "$SSH_PRIVATE" > key
          SSH="ssh -i key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 ubuntu@$IP"
          for i in $(seq 1 20); do $SSH true && break; sleep 15; done
          git archive --format=tar.gz -o omni.tgz HEAD                    # the exact committed tree, nothing else
          scp -i key -o StrictHostKeyChecking=accept-new omni.tgz "ubuntu@$IP:omni.tgz"
          $SSH "mkdir -p omni && tar xzf omni.tgz -C omni && echo $GITHUB_SHA > omni/COMMIT"
          $SSH "cd omni && nohup sudo -n env $ENVS bash $SCRIPT > run.log 2>&1 < /dev/null &"
          sleep 30; $SSH "tail -n 5 omni/run.log" | sed 's/^/  run: /'
          echo "Started; the watch below carries on until it is over." >> "$GITHUB_STEP_SUMMARY"
          rm -f key
      - name: Give the machine back if starting failed
        if: failure() && steps.go.outputs.id != ''
        run: python3 scripts/lambda_gpu.py terminate "${{ steps.go.outputs.id }}"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

  watch1:
    # watch 1 of 6: about 5.7 hours each, 34 hours in all; each carries on where the one before stopped
    needs: launch
    if: always() && needs.launch.outputs.launched == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs: {state: "${{ steps.w.outputs.state }}"}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Watch, fetch, give back
        id: w
        env: {SSH_PRIVATE: "${{ secrets.LAMBDA_SSH_PRIVATE_KEY }}"}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/key"; printf '%s\n' "$SSH_PRIVATE" > "$RUNNER_TEMP/key"
          SSH_KEY="$RUNNER_TEMP/key" bash scripts/lambda_gpu_watch.sh "${{ needs.launch.outputs.id }}" \
            "${{ needs.launch.outputs.ip }}" "${{ needs.launch.outputs.deadline }}" 340 out
          echo "state=$(cat out/state 2>/dev/null || echo watching)" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/key"
      - name: The results, as this run's artifact
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "lambda-gpu-${{ github.job }}-${{ github.run_id }}", path: out, if-no-files-found: ignore, retention-days: 90}
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

  watch2:
    # watch 2 of 6: about 5.7 hours each, 34 hours in all; each carries on where the one before stopped
    needs: [launch, watch1]
    if: always() && needs.launch.outputs.launched == 'true' && needs.watch1.result != 'skipped' && !contains('done deadline gone', needs.watch1.outputs.state || 'x')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs: {state: "${{ steps.w.outputs.state }}"}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Watch, fetch, give back
        id: w
        env: {SSH_PRIVATE: "${{ secrets.LAMBDA_SSH_PRIVATE_KEY }}"}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/key"; printf '%s\n' "$SSH_PRIVATE" > "$RUNNER_TEMP/key"
          SSH_KEY="$RUNNER_TEMP/key" bash scripts/lambda_gpu_watch.sh "${{ needs.launch.outputs.id }}" \
            "${{ needs.launch.outputs.ip }}" "${{ needs.launch.outputs.deadline }}" 340 out
          echo "state=$(cat out/state 2>/dev/null || echo watching)" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/key"
      - name: The results, as this run's artifact
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "lambda-gpu-${{ github.job }}-${{ github.run_id }}", path: out, if-no-files-found: ignore, retention-days: 90}
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

  watch3:
    # watch 3 of 6: about 5.7 hours each, 34 hours in all; each carries on where the one before stopped
    needs: [launch, watch2]
    if: always() && needs.launch.outputs.launched == 'true' && needs.watch2.result != 'skipped' && !contains('done deadline gone', needs.watch2.outputs.state || 'x')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs: {state: "${{ steps.w.outputs.state }}"}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Watch, fetch, give back
        id: w
        env: {SSH_PRIVATE: "${{ secrets.LAMBDA_SSH_PRIVATE_KEY }}"}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/key"; printf '%s\n' "$SSH_PRIVATE" > "$RUNNER_TEMP/key"
          SSH_KEY="$RUNNER_TEMP/key" bash scripts/lambda_gpu_watch.sh "${{ needs.launch.outputs.id }}" \
            "${{ needs.launch.outputs.ip }}" "${{ needs.launch.outputs.deadline }}" 340 out
          echo "state=$(cat out/state 2>/dev/null || echo watching)" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/key"
      - name: The results, as this run's artifact
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "lambda-gpu-${{ github.job }}-${{ github.run_id }}", path: out, if-no-files-found: ignore, retention-days: 90}
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

  watch4:
    # watch 4 of 6: about 5.7 hours each, 34 hours in all; each carries on where the one before stopped
    needs: [launch, watch3]
    if: always() && needs.launch.outputs.launched == 'true' && needs.watch3.result != 'skipped' && !contains('done deadline gone', needs.watch3.outputs.state || 'x')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs: {state: "${{ steps.w.outputs.state }}"}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Watch, fetch, give back
        id: w
        env: {SSH_PRIVATE: "${{ secrets.LAMBDA_SSH_PRIVATE_KEY }}"}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/key"; printf '%s\n' "$SSH_PRIVATE" > "$RUNNER_TEMP/key"
          SSH_KEY="$RUNNER_TEMP/key" bash scripts/lambda_gpu_watch.sh "${{ needs.launch.outputs.id }}" \
            "${{ needs.launch.outputs.ip }}" "${{ needs.launch.outputs.deadline }}" 340 out
          echo "state=$(cat out/state 2>/dev/null || echo watching)" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/key"
      - name: The results, as this run's artifact
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "lambda-gpu-${{ github.job }}-${{ github.run_id }}", path: out, if-no-files-found: ignore, retention-days: 90}
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

  watch5:
    # watch 5 of 6: about 5.7 hours each, 34 hours in all; each carries on where the one before stopped
    needs: [launch, watch4]
    if: always() && needs.launch.outputs.launched == 'true' && needs.watch4.result != 'skipped' && !contains('done deadline gone', needs.watch4.outputs.state || 'x')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs: {state: "${{ steps.w.outputs.state }}"}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Watch, fetch, give back
        id: w
        env: {SSH_PRIVATE: "${{ secrets.LAMBDA_SSH_PRIVATE_KEY }}"}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/key"; printf '%s\n' "$SSH_PRIVATE" > "$RUNNER_TEMP/key"
          SSH_KEY="$RUNNER_TEMP/key" bash scripts/lambda_gpu_watch.sh "${{ needs.launch.outputs.id }}" \
            "${{ needs.launch.outputs.ip }}" "${{ needs.launch.outputs.deadline }}" 340 out
          echo "state=$(cat out/state 2>/dev/null || echo watching)" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/key"
      - name: The results, as this run's artifact
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "lambda-gpu-${{ github.job }}-${{ github.run_id }}", path: out, if-no-files-found: ignore, retention-days: 90}
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

  watch6:
    # watch 6 of 6: about 5.7 hours each, 34 hours in all; each carries on where the one before stopped
    needs: [launch, watch5]
    if: always() && needs.launch.outputs.launched == 'true' && needs.watch5.result != 'skipped' && !contains('done deadline gone', needs.watch5.outputs.state || 'x')
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs: {state: "${{ steps.w.outputs.state }}"}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Watch, fetch, give back
        id: w
        env: {SSH_PRIVATE: "${{ secrets.LAMBDA_SSH_PRIVATE_KEY }}"}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/key"; printf '%s\n' "$SSH_PRIVATE" > "$RUNNER_TEMP/key"
          SSH_KEY="$RUNNER_TEMP/key" bash scripts/lambda_gpu_watch.sh "${{ needs.launch.outputs.id }}" \
            "${{ needs.launch.outputs.ip }}" "${{ needs.launch.outputs.deadline }}" 340 out
          echo "state=$(cat out/state 2>/dev/null || echo watching)" >> "$GITHUB_OUTPUT"
          rm -f "$RUNNER_TEMP/key"
      - name: The results, as this run's artifact
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "lambda-gpu-${{ github.job }}-${{ github.run_id }}", path: out, if-no-files-found: ignore, retention-days: 90}
      - name: Legal files beside the files this run hands out
        if: always()
        uses: actions/checkout@v4
        with:
          path: _legal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Legal notice handed out with this run's files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legal-notice
          overwrite: true
          path: |
            _legal/README.md
            _legal/LICENSE
            _legal/NOTICE
            _legal/DISCLOSURES.md
            _legal/PATENTS.md
            _legal/TRADEMARKS.md
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

  give-back:
    # whatever happened above, the machine goes back (asking twice; an already given-back machine is fine)
    needs: [launch, watch1, watch2, watch3, watch4, watch5, watch6]
    if: always() && needs.launch.outputs.launched == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Give the machine back
        run: |
          python3 scripts/lambda_gpu.py terminate "${{ needs.launch.outputs.id }}" || \
            python3 scripts/lambda_gpu.py terminate "${{ needs.launch.outputs.id }}" || true
          python3 scripts/lambda_gpu.py list | sed 's/^/  still listed: /' || true
      - name: Where the results are
        if: always()
        run: |
          { echo "The results are this run's artifacts (lambda-gpu-watch*-${{ github.run_id }}); the archive bot lands them in"
            echo "the repository when the run id is added to .github/archive_request.txt."; } >> "$GITHUB_STEP_SUMMARY"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

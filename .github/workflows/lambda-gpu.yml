        run: |
          # terminate confirms each machine given back (exit 2 otherwise); asked twice, then a red run that says so
          id="${{ needs.launch.outputs.id }}"; bad=0
          python3 scripts/lambda_gpu.py terminate "$id" || { sleep 30; python3 scripts/lambda_gpu.py terminate "$id"; } || {
            bad=1; echo "::error::Lambda did not confirm machine $id given back: it may still be billing. Terminate it by hand: cloud.lambda.ai, Instances, tick it, Terminate."; }
          python3 scripts/lambda_gpu.py list | sed 's/^/  still listed: /' || true
          exit $bad
      - name: Where the results are

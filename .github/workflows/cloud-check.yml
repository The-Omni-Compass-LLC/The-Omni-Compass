# Google Cloud's and Amazon's check, at no cost (18 October): the cloud's login, the stored key's shape, and the sets'
# pre-flight (the machine type offered, every quota a set needs), then it stops: nothing is built and nothing is billed.
# The conductor (scripts/dispatch_grid.py) starts a cloud's sets only after that cloud's newest check passed (and again
# after a day), and starts a check itself when there is none, the last one failed over an hour ago, or the last pass is a
# day old; so once the founder's fix is stored (a whole Google key, Amazon's Paid plan), the sets start on their own within
# the hour, and a cloud that cannot rent never uses up a set's A, B or C. On Amazon, a quota short of a set is asked of
# Amazon here (the founder's order of 18 October: raised with the cloud, never shrunk to fit). Started by hand: cloud =
# google, amazon or both.
name: cloud-check
# the title the conductor reads a check back by: cloud-check google | cloud-check amazon
run-name: cloud-check ${{ github.event.inputs.cloud || 'both' }}
on:
  workflow_dispatch:
    inputs:
      cloud: {description: "google, amazon or both", default: "both"}
permissions:
  contents: read
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
jobs:
  google:
    if: github.event.inputs.cloud != 'amazon'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      HAS_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS != '' && secrets.GCP_PROJECT != '' }}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - name: The secrets this cloud needs
        if: env.HAS_CREDENTIALS != 'true'
        run: |
          echo "::error::GCP_CREDENTIALS and GCP_PROJECT are not both in this repository's secrets: docs/GOOGLE_SETUP.md, sections 4 and 5."
          exit 2
      - uses: actions/checkout@v4
        with: {sparse-checkout: "scripts\ntools"}
      - name: The key is whole (its shape only; not a character of it is printed)
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: python3 tools/cloud_key_check.py
      - uses: google-github-actions/auth@v2
        with: {credentials_json: "${{ secrets.GCP_CREDENTIALS }}"}
      - uses: google-github-actions/setup-gcloud@v2
      - name: The services the sets use are on (costs nothing)
        run: bash scripts/gcp_services.sh
      - name: The sets' pre-flight, then stop
        env: {REP: "1", GCP_ZONE: us-central1-a, GKE_MACHINE: e2-standard-2, GKE_MAX_NODES: "4", PREFLIGHT_ONLY: "1"}
        run: |
          # the pre-flight's own words on a refusal also stand at the top of the run's page (an annotation)
          set +e; bash scripts/gke_paired.sh 2>&1 | tee preflight.log; rc=${PIPESTATUS[0]}; set -e
          [ "$rc" = 0 ] || { grep '^pre-flight:' preflight.log | tail -3 | while IFS= read -r l; do echo "::error::$l"; done; exit "$rc"; }
      - name: What this check found
        if: always()
        run: |
          if [ "${{ job.status }}" = success ]; then
            echo "**Google Cloud: ready.** The key logs in, the machine type is offered and every quota has room: the conductor starts the sets." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Google Cloud: not ready.** Nothing built, nothing billed; the failed step above says why, and docs/GOOGLE_SETUP.md how to fix it." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  amazon:
    if: github.event.inputs.cloud != 'google'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_CREDENTIALS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - name: The secrets this cloud needs
        if: env.HAS_CREDENTIALS != 'true'
        run: |
          echo "::error::AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are not both in this repository's secrets: docs/AMAZON_SETUP.md, sections 2 and 3."
          exit 2
      - uses: actions/checkout@v4
        with: {sparse-checkout: "scripts\ntools"}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: The sets' pre-flight, then stop (a short quota is asked of Amazon)
        env: {REP: "1", AWS_REGION: us-east-1, EKS_INSTANCE: m5.large, EKS_MAX_NODES: "4", PREFLIGHT_ONLY: "1", QUOTA_REQUEST: "1"}
        run: |
          # the pre-flight's own words on a refusal also stand at the top of the run's page (an annotation)
          set +e; bash scripts/eks_paired.sh 2>&1 | tee preflight.log; rc=${PIPESTATUS[0]}; set -e
          [ "$rc" = 0 ] || { grep '^pre-flight:' preflight.log | tail -3 | while IFS= read -r l; do echo "::error::$l"; done; exit "$rc"; }
      - name: What this check found
        if: always()
        run: |
          if [ "${{ job.status }}" = success ]; then
            echo "**Amazon: ready.** The keys log in, the instance type is offered and the processor quota has room: the conductor starts the sets." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Amazon: not ready.** Nothing built, nothing billed; the failed step above says why, and docs/AMAZON_SETUP.md how to fix it." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

name: six-pool
# One square of the grid from many runs: a size's 1,000 paired runs are cut into several six.yml dispatches (GitHub
# allows 256 jobs in one run), so this workflow downloads every shard of the runs it is given and pools them into one
# receipt (tools/pool_scale.py): the first 1, 10, 100 and 1,000 runs, native and Omni side by side in every square.
# The run ids of each size are listed in results/grid_v5/DISPATCHED.json (scripts/dispatch_grid.py).
on:
  workflow_dispatch:
    inputs:
      runs: {description: "six.yml run ids of one size, comma separated", required: true}
      label: {description: "A name for the pooled receipt (for example x1000)", default: "pooled"}
  push:                    # registers the workflow on the branch it is pushed to; the job runs only when started by hand
permissions:
  contents: read
  actions: read
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
jobs:
  pool:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4      # the code the pooling needs, not the 82,000 result files
        with: {sparse-checkout: "realms\ntools\nomnicompass\nomni_controller"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Every shard of the runs
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ github.event.inputs.runs }}
        run: |
          set -e
          mkdir -p parts
          for r in $(echo "$RUNS" | tr ',' ' '); do
            gh run download "$r" --repo "$GITHUB_REPOSITORY" --pattern 'part-*' --dir "parts/$r" || echo "::warning::run $r: no shards downloaded"
          done
          find parts -name SCALE.json | wc -l
      - name: Pooled into one receipt
        run: python3 tools/pool_scale.py "SIX_${{ github.event.inputs.label }}.md" "parts/*/*/SCALE.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: "six-pooled-${{ github.event.inputs.label }}", path: "SIX_*"}
      - name: Legal files beside the files this run hands out
        if: always()
        uses: actions/checkout@v4
        with:
          path: _legal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Legal notice handed out with this run's files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legal-notice
          overwrite: true
          path: |
            _legal/README.md
            _legal/LICENSE
            _legal/NOTICE
            _legal/DISCLOSURES.md
            _legal/PATENTS.md
            _legal/TRADEMARKS.md
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

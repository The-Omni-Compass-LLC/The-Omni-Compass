      - name: Google's command-line tool
        if: env.CLOUD == 'gcp'
        uses: google-github-actions/setup-gcloud@v2
      - name: Log in to Amazon
        if: env.CLOUD == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.where || 'us-east-1' }}
      - name: Watch, fetch, give back
        id: w
        run: |
          bash scripts/cloud_machine_watch.sh "${{ needs.launch.outputs.id }}" "${{ needs.launch.outputs.deadline }}" 340 out
          echo "state=$(cat out/state 2>/dev/null || echo watching)" >> "$GITHUB_OUTPUT"
      - name: The cells, as this run's artifact
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "cloud-organism-${{ github.job }}-${{ github.run_id }}", path: out, if-no-files-found: ignore, retention-days: 90}
      - name: Legal files beside the files this run hands out
        if: always()
        uses: actions/checkout@v4
        with:
          path: _legal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Legal notice handed out with this run's files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legal-notice
          overwrite: true
          path: |
            _legal/README.md
            _legal/LICENSE
            _legal/NOTICE
            _legal/DISCLOSURES.md
            _legal/PATENTS.md
            _legal/TRADEMARKS.md
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

  give-back:
    # whatever happened above: the machine is given back (nothing runs on the bill after this workflow)
    needs: [launch, watch1, watch2, watch3, watch4, watch5, watch6, watch7]
    if: always() && needs.launch.outputs.launched == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4      # the code, not the archive of raw runs (25 GB, more than the machine's disk)
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/results/live/raw/*
      - name: Log in to Google Cloud
        if: env.CLOUD == 'gcp'
        uses: google-github-actions/auth@v2
        with: {credentials_json: "${{ secrets.GCP_CREDENTIALS }}"}
      - name: Google's command-line tool
        if: env.CLOUD == 'gcp'
        uses: google-github-actions/setup-gcloud@v2
      - name: Log in to Amazon
        if: env.CLOUD == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.where || 'us-east-1' }}
      - name: Give the machine back
        run: |
          python3 scripts/cloud_machine.py terminate "${{ needs.launch.outputs.id }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

name: ycsb
# Omni-Compass on top of a database's operator-set cache size (docs/YCSB_PREREGISTRATION.md): MongoDB from its publisher's
# own repository, YCSB's published core workloads from the project's release (checked against the SHA-256 recorded before any
# run), the operator's fixed WiredTiger cache (native) against the same with the compass law on the cache size through the
# server's own console (omni). One job per workload, three paired repetitions each; one report (YCSB.md). Two workloads at a time.
on:
  workflow_dispatch:
    inputs:
      workloads:
        description: "Workloads, comma separated: tuning, b, c, f, burst; 'all' runs every one"
        default: "all"
      reps: {description: "Paired repetitions per workload", default: "3"}
      step_s: {description: "Seconds per key-space notch", default: "20"}
env:
  MONGO_SERIES: "8.0"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: {workloads: "${{ steps.w.outputs.workloads }}"}
    steps:
      - id: w
        run: |
          if [ "${{ github.event.inputs.workloads }}" = all ] || [ -z "${{ github.event.inputs.workloads }}" ]; then
            w='["tuning","b","c","f","burst"]'
          else
            w=$(python3 -c "import json; print(json.dumps('${{ github.event.inputs.workloads }}'.split(',')))")
          fi
          echo "workloads=$w" | tee -a "$GITHUB_OUTPUT"
  run:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: {workload: "${{ fromJSON(needs.plan.outputs.workloads) }}"}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - run: pip install -r requirements.txt pymongo
      - name: MongoDB from its publisher's repository (signed by the publisher's key)
        run: |
          set -e
          curl -fsSL "https://www.mongodb.org/static/pgp/server-${MONGO_SERIES}.asc" | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server.gpg
          echo "deb [ signed-by=/usr/share/keyrings/mongodb-server.gpg ] https://repo.mongodb.org/apt/ubuntu $(lsb_release -cs)/mongodb-org/${MONGO_SERIES} multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org.list
          sudo apt-get update -q
          sudo apt-get install -y -q mongodb-org
          sudo systemctl enable --now mongod
          for i in $(seq 1 30); do mongod --version >/dev/null 2>&1 && python -c "import pymongo; pymongo.MongoClient('mongodb://127.0.0.1:27017', serverSelectionTimeoutMS=2000).server_info()" 2>/dev/null && break; sleep 2; done
          mongod --version | head -1
          python tools/run_ycsb.py --setup
      - name: Run the workload, native and omni
        run: |
          set +e
          python tools/run_ycsb.py --workloads "${{ matrix.workload }}" --reps "${{ github.event.inputs.reps }}" --step-s "${{ github.event.inputs.step_s }}" --out out > run.log 2>&1
          code=$?
          tail -40 run.log
          grep "^==\|^   " run.log | tee -a "$GITHUB_STEP_SUMMARY"
          sudo cp /var/log/mongodb/mongod.log out/mongod.log 2>/dev/null || true
          exit $code
      - run: cd out && find . -type f -name '*.raw' -size +20M -delete; find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: "ycsb-${{ matrix.workload }}", path: out}
  report:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/download-artifact@v4
        with: {pattern: "ycsb-*", path: all, merge-multiple: true}
      - run: ls all && python tools/run_ycsb.py --report-only all && cat all/YCSB.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: {name: ycsb-report, path: all/YCSB.md}

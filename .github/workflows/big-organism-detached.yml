name: big-organism-detached
# The organism too big for one GitHub job even on a rented machine: the four stacked at 1,000 copies (1.7 million modelled
# muscles) with the real cluster inside takes more than GitHub's six-hour job limit per repetition (every attempt in the
# big-organism workflow was cut off). So the test is detached from the job: "start" rents one Azure machine
# (Standard_D8s_v4, 8 vCPU, 32 GiB, list price about $0.38 an hour), installs the tools, starts every repetition of every
# organism in turn under nohup (scripts/kind_paired.sh: native against native with Omni-Compass on top, a fresh
# six-worker kind cluster per arm, the organism at the asked size with the real cluster inside), and leaves the machine
# running. The machine is tagged omni-detached=1. "collect" runs every two hours on the clock (or by hand): for each tagged
# machine it looks whether every repetition has finished; if so it copies every file back, publishes one artifact per
# cell (six-<organism>-x<size>-<rep>, the same shape as big-organism's), and deletes the machine and its resource group;
# if not, it reports the progress and leaves the machine alone. A machine older than max_hours is collected as it is
# and deleted (nothing runs forever on the bill). Uses the AZURE_CREDENTIALS secret; nothing to do by hand. The
# artifacts are archived with the code by archive-run (results/live/raw/run-<collect run id>/).
# The commit the test runs is an input (default: the dispatching commit), so an older engine can be run again on the same
# machine: the organism names must then be the ones that commit knows (v1: organism_656, stack_1226).
on:
  workflow_dispatch:
    inputs:
      mode: {description: "start (rent and start), collect (look at every running machine now) or survey (which 8-vCPU sizes this subscription may rent, region by region, and each region's quota; rents nothing)", default: "start"}
      organisms: {description: "Organisms, comma separated (start)", default: "stack"}
      size: {description: "Copies of each organism on one clock (start)", default: "1000"}
      reps: {description: "Paired repetitions per organism (start)", default: "3"}
      duration_s: {description: "Measured seconds per arm (240 organism steps) (start)", default: "2880"}
      commit: {description: "The commit to run (start); empty = this one", default: ""}
      vm_size: {description: "Azure machine size (start); Standard_D8as_v4 is the size eastus granted on 2026-10-05", default: "Standard_D8as_v4"}
      location: {description: "Azure region (start). Survey of 2026-10-06: eastus allows 32 vCPUs and the v4 sizes; every other region allows 10 vCPUs and only the v5 to v7 sizes (the sizes tried fall back to v7)", default: "eastus"}
      max_hours: {description: "Collect and delete a machine older than this, finished or not (start: stored on the machine's group; collect: the default for machines without one)", default: "40"}
      test: {description: "organism (the organisms with the cluster inside, above) or robust (the robustness long scenario, docs/ROBUSTNESS_PREREGISTRATION.md: the governor's memory and decisions over duration_s an arm, the wandering schedule repeated; the 24-hour run)", default: "organism"}
      group: {description: "collect: look at this resource group only (omni-detached-<run id>); empty = every tagged machine", default: ""}
  schedule:
    - cron: "41 */2 * * *"       # collect: a look at every tagged machine; nothing to do when none is running
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. All patents, copyrights and trademarks filed in the USA. Everything in this repository is subject to change at any time; www.omni-compass.com is the authority of record. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`.'
jobs:
  survey:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'survey'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: azure/login@v2
        with: {creds: "${{ secrets.AZURE_CREDENTIALS }}"}
      - name: Which sizes may this subscription rent, where
        run: |
          # the 8-vCPU sizes the start job tries, in the regions it could use: unrestricted sizes and the regional quota
          echo "| Region | vCPUs used/allowed | 8-vCPU sizes this subscription may rent |"; echo "|---|---|---|"
          for loc in eastus eastus2 westus westus2 westus3 centralus southcentralus northcentralus canadacentral westeurope northeurope uksouth swedencentral australiaeast; do
            q=$(az vm list-usage -l "$loc" --query "[?name.value=='cores'].join('/', [to_string(currentValue), to_string(limit)]) | [0]" -o tsv 2>/dev/null)
            s=$(az vm list-skus -l "$loc" --resource-type virtualMachines -o tsv 2>/dev/null \
                  --query "[?(starts_with(name,'Standard_D8') || starts_with(name,'Standard_E4') || starts_with(name,'Standard_B8') || starts_with(name,'Standard_F8')) && length(restrictions)==\`0\`].name" | sort -u | tr '\n' ' ')
            echo "| $loc | ${q:-?} | ${s:-none} |"
            echo "::notice::$loc: quota ${q:-?}; may rent: ${s:-none}"
          done
      - name: The allowance in eastus, family by family
        run: |
          # every machine family with an allowance or vCPUs in use (a fleet run fails on the family, not the region);
          # ten notices a step is all GitHub shows, so the families with vCPUs in use come first
          az vm list-usage -l eastus -o json > usage.json
          python3 - <<'PY'
          import json
          rows = [(u["name"]["value"], int(u["currentValue"]), int(u["limit"])) for u in json.load(open("usage.json"))]
          used = [r for r in rows if r[1] > 0]
          allowed = [r for r in rows if r[2] > 0 and r[1] == 0 and "Family" in r[0]]
          print("::notice::eastus, in use: " + "; ".join(f"{n} {c}/{l}" for n, c, l in used))
          print("::notice::eastus, families allowed and idle: " + "; ".join(f"{n} {l}" for n, c, l in allowed))
          print("::notice::eastus, families with no allowance: " + ", ".join(n for n, c, l in rows if l == 0 and "Family" in n)[:900])
          PY
      - name: List prices of the 2-vCPU worker sizes in eastus (Azure's public price list)
        run: |
          # the bill is each pool's machine-hours at its family's list price (aks-metered pool_prices); the prices come
          # from Azure's own retail price API, Linux, pay as you go, eastus
          out=""
          for s in Standard_D2s_v4 Standard_D2as_v4 Standard_D2_v4 Standard_D2ds_v4 Standard_D2d_v4 Standard_D2s_v3 Standard_D2_v2 Standard_D2as_v7 Standard_D2ads_v7 Standard_D2als_v7 Standard_D2alds_v7 Standard_D2s_v7 Standard_D2ds_v7 Standard_D2ls_v7 Standard_D2lds_v7 Standard_D2s_v6 Standard_D2ds_v6 Standard_D2ls_v6 Standard_D2lds_v6 Standard_B2s_v2 Standard_B2als_v2; do
            p=$(curl -sS --max-time 30 "https://prices.azure.com/api/retail/prices?\$filter=armRegionName%20eq%20'eastus'%20and%20armSkuName%20eq%20'$s'%20and%20priceType%20eq%20'Consumption'" \
                | python3 -c "import sys,json; d=json.load(sys.stdin); r=[i for i in d.get('Items',[]) if 'Windows' not in i['productName'] and 'Spot' not in i['skuName'] and 'Low Priority' not in i['skuName']]; print(r[0]['retailPrice'] if r else 'none')" 2>/dev/null || echo "?")
            out="$out $s=$p;"
          done
          echo "::notice::eastus list prices, Linux, pay as you go, USD a machine-hour:$out"
      - name: What of ours still stands
        run: |
          # a cluster still being deleted holds its family's vCPUs
          g=$(az group list -o tsv --query "[?starts_with(name,'omni')].join(' ', [name, properties.provisioningState, location])" | tr '\n' ';')
          echo "::notice::our resource groups: ${g:-none}"
          c=$(az aks list -o tsv --query "[].join(' ', [resourceGroup, name, provisioningState])" 2>/dev/null | tr '\n' ';')
          echo "::notice::our clusters: ${c:-none}"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  start:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'start'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RG: omni-detached-${{ github.run_id }}
      LOC: ${{ github.event.inputs.location || 'eastus' }}
      SIZE: ${{ github.event.inputs.vm_size || 'Standard_D8as_v4' }}
      ORGS: ${{ github.event.inputs.organisms || 'stack' }}
      SCALE: ${{ github.event.inputs.size || '1000' }}
      REPS: ${{ github.event.inputs.reps || '3' }}
      DUR: ${{ github.event.inputs.duration_s || '2880' }}
      SHA: ${{ github.event.inputs.commit || github.sha }}
      TEST: ${{ github.event.inputs.test || 'organism' }}
      MAXH: ${{ github.event.inputs.max_hours || '40' }}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with: {creds: "${{ secrets.AZURE_CREDENTIALS }}"}
      - name: Rent the machine
        run: |
          az group create -n "$RG" -l "$LOC" -o none \
            --tags omni-detached=1 "organisms=$ORGS" "size=$SCALE" "reps=$REPS" "sha=$SHA" "started=$(date -u +%s)" "run=${{ github.run_id }}" "test=$TEST" "max_hours=$MAXH"
          ok=""
          for sz in "$SIZE" Standard_D8as_v4 Standard_D8s_v4 Standard_D8as_v7 Standard_D8s_v7 Standard_D8ls_v7 Standard_E4as_v7 Standard_B8as_v2; do
            if az vm create -g "$RG" -n big --image Ubuntu2204 --size "$sz" --admin-username omni \
                 --generate-ssh-keys --public-ip-sku Standard --os-disk-size-gb 128 -o none 2> err.txt; then
              ok="$sz"; echo "::notice::rented $sz in $LOC"; break
            fi
            # the CLI hides Azure's refusal behind its own "content already consumed" error, so the reason is asked for
            # separately: the size's restriction in this region for this subscription (none listed means the quota, or a
            # passing fault)
            why=$(az vm list-skus -l "$LOC" --size "$sz" --resource-type virtualMachines -o tsv \
                    --query "[?name=='$sz'].join(',', restrictions[].reasonCode) | [0]" 2>/dev/null)
            echo "::warning::$sz refused in $LOC: ${why:-no restriction listed for this subscription; the regional quota ($(az vm list-usage -l "$LOC" --query "[?name.value=='cores'].join('/', [to_string(currentValue), to_string(limit)]) | [0]" -o tsv) vCPUs used/allowed), or a passing fault}"
            az vm delete -g "$RG" -n big --yes -o none 2>/dev/null || true
          done
          if [ -z "$ok" ]; then
            echo "::error::no machine size was granted in $LOC (the survey mode lists, region by region, the sizes this subscription may rent)"
            az group delete -n "$RG" --yes --no-wait || true; exit 1
          fi
          az group update -n "$RG" --set "tags.vm=$ok" -o none
          ip=$(az vm show -d -g "$RG" -n big --query publicIps -o tsv); echo "IP=$ip" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 omni@$ip true && break; sleep 10; done
      - name: Install the tools on it
        run: |
          ssh -o StrictHostKeyChecking=no omni@$IP 'set -e
            # a fresh machine sometimes gets a stale package list (one attempt lost its machine to "unable to locate package
            # docker.io"): the update and the install are tried five times
            for i in 1 2 3 4 5; do
              if sudo apt-get update -qq && sudo apt-get install -y -qq docker.io jq git python3-pip python3-venv curl >/dev/null; then break; fi
              [ "$i" = 5 ] && exit 1; sleep 30
            done
            sudo usermod -aG docker omni
            printf "fs.inotify.max_user_watches=524288\nfs.inotify.max_user_instances=512\n" | sudo tee /etc/sysctl.d/99-kind.conf >/dev/null && sudo sysctl -q --system
            curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/latest/download/kind-linux-amd64 && sudo install kind /usr/local/bin/kind
            curl -fsSLo kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && sudo install kubectl /usr/local/bin/kubectl
            git clone -q https://github.com/${{ github.repository }}.git omni && cd omni && git checkout -q '"$SHA"'
            python3 -m venv .v && .v/bin/pip install -q -r requirements.txt'
      - name: Start every repetition, detached from this job
        run: |
          # the runner script: every repetition of every organism in turn, each cell's files moved into cells/<cell>/ when
          # it ends (bench-<arm>-<rep> carries no organism name), one .exit per cell, ALL_DONE at the end
          # test=robust runs the robustness long scenario instead (scripts/kind_bench.sh with ROBUST=long, the wandering
          # schedule repeated to fill the window, no organism): one cell a repetition, robust-long-x<seconds>-<rep>
          cat > run_all.sh <<EOF
          #!/bin/bash
          cd \$HOME/omni
          export PATH=\$PWD/.v/bin:\$PATH ARMS="native compass" DURATION=$DUR ORGANISM_SCALE=$SCALE LOAD_MAX=6 LOADGEN=open
          export CLOSURE=tuning/GLOBAL_LEAGUE_PREREGISTRATION.json
          mkdir -p cells
          if [ "$TEST" = robust ]; then
            w="1 2 3 2 3 4 5 6 5 4 5 6 7 8 7 6 5 4 3 4 3 2 1 2 1"; s=""
            for i in \$(seq 1 $((DUR / 900))); do s="\$s \$w"; done
            export ROBUST=long LOAD_STEPS_IN="\${s# }"
            for rep in \$(seq 1 $REPS); do
              cell="robust-long-x$DUR-\$rep"; echo "\$(date -u +%FT%TZ) start \$cell"
              REP=\$rep bash scripts/kind_paired.sh > "paired-\$cell.log" 2>&1; code=\$?
              mkdir -p "cells/\$cell" && mv bench-*-"\$rep" "cells/\$cell/" 2>/dev/null; mv "paired-\$cell.log" "cells/\$cell/paired.log"
              echo "\$code" > "cells/\$cell/paired.exit"; echo "\$(date -u +%FT%TZ) end \$cell exit \$code"
            done
          else
          for rep in \$(seq 1 $REPS); do for org in \$(echo "$ORGS" | tr , ' '); do
            cell="six-\$org-x$SCALE-\$rep"; echo "\$(date -u +%FT%TZ) start \$cell"
            ORGANISM=\$org REP=\$rep bash scripts/kind_paired.sh > "paired-\$cell.log" 2>&1; code=\$?
            mkdir -p "cells/\$cell" && mv bench-*-"\$rep" "cells/\$cell/" 2>/dev/null; mv "paired-\$cell.log" "cells/\$cell/paired.log"
            echo "\$code" > "cells/\$cell/paired.exit"; echo "\$(date -u +%FT%TZ) end \$cell exit \$code"
          done; done
          fi
          touch ALL_DONE
          EOF
          scp -o StrictHostKeyChecking=no run_all.sh omni@$IP:omni/run_all.sh
          # the test is started in the background with every file handle redirected, and nothing else is put in the
          # background with it (an "a && b &" list would leave a shell holding this ssh session open until the test ends)
          ssh -o StrictHostKeyChecking=no omni@$IP 'cd omni; nohup setsid sg docker -c "bash run_all.sh" > detached.log 2>&1 < /dev/null & disown; sleep 90; echo "--- detached.log"; cat detached.log; echo "--- paired log"; tail -5 paired-*.log 2>/dev/null; pgrep -af kind_paired >/dev/null && echo RUNNING || { echo "::error::the test is not running"; exit 1; }'
          echo "::notice::$RG in $LOC: test $TEST, $ORGS at $SCALE copies, $REPS repetitions of $DUR s an arm, commit $SHA, collected and deleted after $MAXH h at the latest; collect looks at it every two hours"
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
  collect:
    if: github.event_name == 'schedule' || github.event.inputs.mode == 'collect'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: azure/login@v2
        with: {creds: "${{ secrets.AZURE_CREDENTIALS }}"}
      - name: Look at every running machine
        id: look
        run: |
          max_h=${{ github.event.inputs.max_hours || '40' }}
          groups=$(az group list --tag omni-detached=1 --query "[].name" -o tsv)
          only="${{ github.event.inputs.group }}"; [ -z "$only" ] || groups=$(echo "$groups" | grep -x "$only" || true)
          [ -n "$groups" ] || { echo "::notice::no detached machine is running"; echo "any=0" >> "$GITHUB_OUTPUT"; exit 0; }
          mkdir -p out; any=0
          for RG in $groups; do
            tags=$(az group show -n "$RG" --query tags -o json); echo "$RG: $tags"
            started=$(echo "$tags" | jq -r .started); age_h=$(( ($(date -u +%s) - started) / 3600 ))
            # a machine started with its own limit (the max_hours tag, e.g. the 24-hour robustness run) keeps it; the input is for the rest
            own=$(echo "$tags" | jq -r '.max_hours // empty'); max_h_rg=${own:-$max_h}
            ip=$(az vm show -d -g "$RG" -n big --query publicIps -o tsv 2>/dev/null)
            if [ -z "$ip" ]; then echo "::warning::$RG has no machine (deleted, or never rented)"; [ "$age_h" -ge 2 ] && az group delete -n "$RG" --yes --no-wait; continue; fi
            # a fresh key for this job only, placed on the machine by Azure (the start job's key died with its runner)
            rm -f k k.pub; ssh-keygen -q -N "" -f k
            az vm user update -g "$RG" -n big -u omni --ssh-key-value "$(cat k.pub)" -o none
            S="ssh -i k -o StrictHostKeyChecking=no -o ConnectTimeout=20 omni@$ip"
            # the state, then the progress of the cell under way: which arm the paired script is on, the last line of its
            # log, and the organism's own log (built, window open, steps done), so a slow machine can be told from a stuck one
            state=$($S 'cd omni; ls cells 2>/dev/null | tr "\n" " "; echo; test -f ALL_DONE && echo ALL_DONE || echo RUNNING; tail -3 detached.log;
                        for f in paired-*.log; do [ -f "$f" ] && echo "$f: $(grep -c "^######## ARM" "$f") arm(s) started; last: $(tail -1 "$f" | cut -c1-160)"; done
                        for d in bench-*-*; do [ -d "$d" ] && echo "$d: $(ls "$d" | tr "\n" " " | cut -c1-200)"; [ -f "$d/organism.log" ] && tail -2 "$d/organism.log" | cut -c1-200; done
                        uptime; free -g | head -2')
            echo "$state"
            # the progress lines as notices too (GitHub shows ten a step), so a slow machine can be told from a stuck one
            # without the log: the arms started, the paired script's last line, the organism's own last lines, the load
            echo "$state" | tail -n +3 | grep -v "^$" | head -8 | while IFS= read -r l; do echo "::notice::$RG: ${l:0:300}"; done
            if ! echo "$state" | grep -q ALL_DONE; then
              if [ "$age_h" -lt "$max_h_rg" ]; then
                echo "::notice::$RG running ${age_h} h (limit ${max_h_rg} h): $(echo "$state" | head -1 | sed 's/^$/no cell finished yet/') finished; left alone"; continue
              fi
              echo "::warning::$RG is ${age_h} h old (limit ${max_h_rg} h): collected as it stands and deleted"
              $S 'cd omni && for d in bench-*-*; do [ -d "$d" ] && { mkdir -p cells/unfinished && mv "$d" cells/unfinished/; }; done; true'
            fi
            scp -i k -o StrictHostKeyChecking=no -r "omni@$ip:omni/cells/*" out/ || true
            scp -i k -o StrictHostKeyChecking=no "omni@$ip:omni/detached.log" "out/detached-$RG.log" || true
            { $S 'free -g; df -h /'; echo "$tags"; } > "out/machine-$RG.txt" 2>&1 || true
            for c in out/six-* out/robust-*; do [ -d "$c" ] && echo "::notice::$(basename "$c"): exit $(cat "$c/paired.exit" 2>/dev/null || echo missing), $(find "$c" -type f | wc -l) files"; done
            az group delete -n "$RG" --yes --no-wait || true; any=1
          done
          echo "any=$any" >> "$GITHUB_OUTPUT"
      # one artifact per cell, the same shape as big-organism's (six-<organism>-x<size>-<rep>); up to six cells per look
      - name: Name the cells collected
        id: cells
        if: steps.look.outputs.any == '1'
        run: |
          i=0; for c in out/six-* out/robust-*; do [ -d "$c" ] || continue; i=$((i + 1)); echo "c$i=$(basename "$c")" >> "$GITHUB_OUTPUT"; done
          [ "$i" -le 6 ] || echo "::warning::$i cells collected, only the first six are published as artifacts; the rest are in detached-machines"
      - uses: actions/upload-artifact@v4
        if: steps.cells.outputs.c1 != ''
        with: {name: "${{ steps.cells.outputs.c1 }}", path: "out/${{ steps.cells.outputs.c1 }}", if-no-files-found: ignore}
      - uses: actions/upload-artifact@v4
        if: steps.cells.outputs.c2 != ''
        with: {name: "${{ steps.cells.outputs.c2 }}", path: "out/${{ steps.cells.outputs.c2 }}", if-no-files-found: ignore}
      - uses: actions/upload-artifact@v4
        if: steps.cells.outputs.c3 != ''
        with: {name: "${{ steps.cells.outputs.c3 }}", path: "out/${{ steps.cells.outputs.c3 }}", if-no-files-found: ignore}
      - uses: actions/upload-artifact@v4
        if: steps.cells.outputs.c4 != ''
        with: {name: "${{ steps.cells.outputs.c4 }}", path: "out/${{ steps.cells.outputs.c4 }}", if-no-files-found: ignore}
      - uses: actions/upload-artifact@v4
        if: steps.cells.outputs.c5 != ''
        with: {name: "${{ steps.cells.outputs.c5 }}", path: "out/${{ steps.cells.outputs.c5 }}", if-no-files-found: ignore}
      - uses: actions/upload-artifact@v4
        if: steps.cells.outputs.c6 != ''
        with: {name: "${{ steps.cells.outputs.c6 }}", path: "out/${{ steps.cells.outputs.c6 }}", if-no-files-found: ignore}
      - uses: actions/upload-artifact@v4
        if: steps.look.outputs.any == '1'
        with: {name: "detached-machines", path: "out/*.log\nout/*.txt\nout/unfinished\nout/six-*[7-9]\n!out/six-*-[1-6]", if-no-files-found: ignore}
      - name: Legal files beside the files this run hands out
        if: always()
        uses: actions/checkout@v4
        with:
          path: _legal
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            README.md
            LICENSE
            NOTICE
            DISCLOSURES.md
            PATENTS.md
            TRADEMARKS.md
      - name: Legal notice handed out with this run's files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legal-notice
          overwrite: true
          path: |
            _legal/README.md
            _legal/LICENSE
            _legal/NOTICE
            _legal/DISCLOSURES.md
            _legal/PATENTS.md
            _legal/TRADEMARKS.md
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

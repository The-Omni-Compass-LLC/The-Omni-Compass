name: grid
# The conductor of the 96-square grid on the max (scripts/dispatch_grid.py): every 15 minutes it reads which runs of every
# square are started, from the runs' own names, and starts the next ones (the 10-run squares of every size first, then
# 100, then 1,000) until the repository's queued and running jobs reach what GitHub is running now plus a margin; so every
# runner GitHub gives this repository is busy and the queue never holds more than the margin (other workflows, such as the
# collector of rented machines, still get a runner within minutes). It never starts a run twice and never starts a run
# on another engine. When every square is started it starts nothing. To stop the grid: Actions -> grid -> "..." ->
# Disable workflow (and cancel the six and six-kube runs in flight). Started by hand it ticks at once; dry_run says what
# it would start.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      grid: {description: "all, six (modelled) or six-kube (the real cluster inside)", default: "all"}
      dry_run: {description: "yes: say what would start, start nothing", default: "no"}
      max_machines: {description: "Rented Azure machines at once for the biggest squares (what the quota holds: eastus allows 200 vCPUs, one 8-vCPU machine per family)", default: "20"}
      budget_usd: {description: "The most the rented machines may be committed to, in dollars, estimated at list price (the founder's figure)", default: "5000"}
permissions:
  actions: write
  contents: read
concurrency: {group: grid-conductor, cancel-in-progress: false}
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAVE_AZURE: ${{ secrets.AZURE_CREDENTIALS != '' }}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with: {sparse-checkout: "scripts\nresults/grid_v5\ntools\nrealms\nomnicompass\nomni_controller"}
      - name: Start the squares' next runs
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: |
          python3 scripts/dispatch_grid.py tick --grid "${{ github.event.inputs.grid || 'all' }}" --ref "${{ github.ref_name }}" \
            $([ "${{ github.event.inputs.dry_run }}" = yes ] && echo --dry)
      # the squares too big for a GitHub machine: rented Azure machines (big-organism-detached), up to what the quota holds
      # and never past the budget; nothing is rented without the AZURE_CREDENTIALS secret
      - uses: azure/login@v2
        if: env.HAVE_AZURE == 'true' && (github.event.inputs.grid || 'all') == 'all'
        with: {creds: "${{ secrets.AZURE_CREDENTIALS }}"}
      - name: The biggest squares on rented machines
        if: env.HAVE_AZURE == 'true' && (github.event.inputs.grid || 'all') == 'all'
        env: {GITHUB_TOKEN: "${{ github.token }}"}
        run: |
          now=$(az group list --tag omni-detached=1 --query "length(@)" -o tsv)
          python3 scripts/dispatch_grid.py azure-tick --ref "${{ github.ref_name }}" --machines-now "${now:-0}" \
            --max-machines "${{ github.event.inputs.max_machines || '20' }}" --budget "${{ github.event.inputs.budget_usd || '5000' }}" \
            $([ "${{ github.event.inputs.dry_run }}" = yes ] && echo --dry)
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"

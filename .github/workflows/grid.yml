name: grid
# The conductor of the grid on the max (scripts/dispatch_grid.py): the six organisms at 1, 10 and 100 copies, each to 100
# runs (1, 10 and 100 only, the founder's order of 12 October), modelled and with the real cluster inside. Every 15
# minutes it reads which runs of every square are started, from the runs' own names, and starts the next ones (the 10-run
# squares of every size first, then 100) until the repository's queued and running jobs reach what GitHub is running now
# plus a margin; so every runner GitHub gives this repository is busy and the queue never holds more than the margin
# (other workflows still get a runner within minutes). Every square runs on GitHub's own machines; nothing is rented. It
# never starts a run twice and never starts a run on another engine; when every square is started it starts nothing. One job ticks every 15 minutes for five hours, then starts the next job (GitHub's own
# schedule here is delayed by hours under load; the schedule below only restarts the chain if it ever breaks, and two
# conductors never run at once). To stop the grid: Actions -> grid -> "..." -> Disable workflow (and cancel the six and
# six-kube runs in flight). Started by hand it ticks at once; dry_run says what it would start, once.
on:
  schedule:
    - cron: "7 */3 * * *"
  workflow_dispatch:
    inputs:
      grid: {description: "all, six (modelled) or six-kube (the real cluster inside)", default: "all"}
      dry_run: {description: "yes: say once what would start, start nothing", default: "no"}
permissions:
  actions: write
  contents: read
concurrency: {group: grid-conductor, cancel-in-progress: false}
env:
  OMNI_NOTICE: '© 2026 The Omni-Compass LLC. All rights reserved. **Evaluation and simulation use only.** Any commercial use, commercialization, monetization, production use, redistribution or hosted service of any part of Omni-Compass requires a signed, paid Omni-Compass Enterprise License from The Omni-Compass LLC. Every copy, export, report and printout carries this notice with `LICENSE`, `NOTICE` and `DISCLOSURES.md`. All patents, copyrights and trademarks filed in the USA. www.omni-compass.com'
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      GRID: ${{ github.event.inputs.grid || 'all' }}
      DRY: ${{ github.event.inputs.dry_run || 'no' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Legal notice at the top of this job's report
        run: printf '> %s\n\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with: {sparse-checkout: "scripts\nresults/grid_v5\ntools\nrealms\nomnicompass\nomni_controller"}
      - name: Start the squares' next runs, every 15 minutes for five hours
        run: |
          rounds=18; [ "$DRY" = yes ] && rounds=1      # 18 ticks 15 minutes apart: under the job's 340 minutes
          for i in $(seq 1 $rounds); do
            echo "== tick $i of $rounds at $(date -u +%H:%M) UTC"
            python3 scripts/dispatch_grid.py tick --grid "$GRID" --ref "${{ github.ref_name }}" $([ "$DRY" = yes ] && echo --dry) \
              || echo "::warning::tick $i: the conductor stopped (tried again next tick)"
            if [ "$i" -lt "$rounds" ]; then sleep 900; fi
          done
      - name: The next conductor (one at a time; it waits for this one to end)
        if: ${{ !cancelled() && env.DRY != 'yes' }}
        run: |
          # another conductor already waiting (the schedule's, or a hand start) carries on instead; a cancelled conductor
          # starts none (to stop the grid, disable this workflow)
          waiting=0
          for st in queued pending waiting requested; do
            n=$(curl -fsS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/grid.yml/runs?status=$st&per_page=5" \
              | python3 -c "import sys, json; print(len(json.load(sys.stdin).get('workflow_runs', [])))" || echo 0)
            waiting=$((waiting + n))
          done
          if [ "$waiting" = 0 ]; then
            curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/grid.yml/dispatches" \
              -d "{\"ref\": \"${{ github.ref_name }}\", \"inputs\": {\"grid\": \"$GRID\"}}" \
              && echo "the next conductor is started"
          else
            echo "a conductor is already waiting: it carries on"
          fi
      - name: Legal notice at the end of this job's report
        if: always()
        run: printf '\n---\n\n*%s*\n' "$OMNI_NOTICE" >> "$GITHUB_STEP_SUMMARY"
